server:
  port: 8080

app:
  # Root directory for the H2 database and uploaded palace images.
  # Override with the APP_DATA_DIR environment variable to avoid depending on the working directory.
  data-dir: ${APP_DATA_DIR:./data}
  palace-upload-dir: ${app.data-dir}/palaces

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:file:${app.data-dir}/memory_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    # Run data.sql after Hibernate has created/updated the tables
    defer-datasource-initialization: true
  sql:
    init:
      # data.sql only inserts seed rows into empty tables, so it is safe to run on every startup
      mode: always
      encoding: UTF-8

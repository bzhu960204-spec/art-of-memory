# Test profile: in-memory database and a throwaway upload directory, so tests never touch real user data.
app:
  data-dir: ${java.io.tmpdir}/art-of-memory-test
  palace-upload-dir: ${app.data-dir}/palaces

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: false
